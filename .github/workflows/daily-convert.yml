name: Daily convert

on:
  schedule:
    # 19:00 UTC every day
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch upstream and convert
        run: python3 convert.py

      - name: Commit if changed
        run: |
          FILES="libretv-config.json libretv-config-jingjian.json libretv-config-jin18.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "outputs unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: daily source update [skip ci]"
          git push
